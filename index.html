{t:"HALAURA",c:"Market research · Brand strategy · E-commerce",g:"Where Light Breathes.",d:"A proposed wellness candle brand combining beeswax, halite salt crystals and essential oils, born from a market opportunity spotted in Tunisia. The name blends Halite and Aura.",b:["Market needs, competitors and SWOT","Three micro-niches and a buyer persona","Survey of 48 respondents","Go/No-Go, e-commerce model, sourcing and pricing","Name, logo, slogan, palette and mood board"],s:"Survey highlights: 85.4% had never heard of a salt-crystal candle; 75% were likely or very likely to buy; 72.9% prefer online stores; the most preferred price range was 30–40 TND.",n:"Results come from a 48-person academic survey, not the whole Tunisian market. Purification and wellness benefits are claims within the concept, not independently verified."},
